<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d9488">
<title>صحتي Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#f0fdfa;color:#1e293b;min-height:100vh}
.c{max-width:640px;margin:0 auto;padding:16px;padding-bottom:80px}
header{text-align:center;padding:24px 0}
h1{color:#0f766e;font-size:1.8rem;font-weight:800}
p.sub{color:#64748b;font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stats>div{background:#fff;padding:14px 6px;border-radius:12px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.08);border:1px solid #e2e8f0}
.stats b{font-size:1.5rem;color:#0d9488;display:block}
.stats span{font-size:.72rem;color:#64748b;font-weight:700}
.bar{display:flex;gap:6px;margin-bottom:14px}
.bar button{flex:1;padding:8px;border:1px solid #e2e8f0;background:#fff;border-radius:8px;font-size:.78rem;font-weight:800;color:#64748b;cursor:pointer}
.tabs{display:flex;gap:4px;margin-bottom:16px;background:#fff;padding:5px;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);border:1px solid #e2e8f0}
.tab{flex:1;padding:12px 2px;text-align:center;border-radius:8px;cursor:pointer;font-weight:800;color:#64748b;font-size:.78rem;background:transparent;border:none}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);border:1px solid #e2e8f0}
.tit{font-size:1rem;color:#0f766e;font-weight:800;margin-bottom:12px;border-bottom:2px solid #ccfbf1;padding-bottom:8px}
.fg{margin-bottom:11px}
.fg label{display:block;margin-bottom:4px;font-weight:700;font-size:.85rem}
input,select,textarea{width:100%;padding:11px 12px;border:2px solid #ccfbf1;border-radius:8px;font-size:.9rem;outline:none}
textarea{min-height:60px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:13px;border:none;border-radius:8px;font-size:.95rem;font-weight:800;background:#0d9488;color:#fff;cursor:pointer}
.btn:hover{background:#0f766e}
.alert{background:#fff7ed;border-right:4px solid #f59e0b;padding:12px;border-radius:8px;margin-bottom:10px;font-size:.88rem}
.alert.d{background:#fee2e2;border-right-color:#ef4444}
.alert.i{background:#eff6ff;border-right-color:#3b82f6}
.alert b{display:block;margin-bottom:3px}
.alert span{color:#7c2d12;font-size:.82rem;display:block}
.bdg{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.68rem;font-weight:800;margin-right:4px}
.bd{background:#fee2e2;color:#991b1b}
.bw{background:#fef3c7;color:#92400e}
.bs{background:#d1fae5;color:#065f46}
.emp{text-align:center;padding:30px;color:#94a3b8}
.emp em{display:block;font-size:3rem;margin-bottom:10px;font-style:normal;opacity:.6}
.it{background:#f8fafc;border-radius:10px;padding:14px;margin-bottom:10px;border:1px solid #e2e8f0;position:relative}
.it .n{font-weight:800;font-size:.95rem;padding-left:30px}
.it .m{font-size:.82rem;color:#64748b;display:block;margin-top:5px;line-height:1.7}
.it .m strong{color:#0f766e}
.it .rec{background:#eff6ff;border-right:3px solid #3b82f6;padding:6px 10px;border-radius:6px;margin-top:8px;font-size:.82rem;color:#1e40af}
.it .act{display:flex;gap:6px;margin-top:10px}
.it .act button{flex:1;padding:6px;border:none;border-radius:6px;font-size:.75rem;font-weight:800;cursor:pointer}
.rn{background:#d1fae5;color:#065f46}
.dl{background:#fee2e2;color:#991b1b}
.del{position:absolute;top:10px;left:10px;background:#ef4444;color:#fff;border:none;width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:1rem}
.info{background:#eff6ff;border-right:4px solid #3b82f6;padding:10px;border-radius:6px;margin-bottom:12px;font-size:.84rem;color:#1e40af}
.src{position:relative;margin-bottom:10px}
.src input{width:100%;padding:10px 12px;border:2px solid #ccfbf1;border-radius:8px;font-size:.9rem}
.sort{display:flex;gap:6px;margin-bottom:10px;align-items:center}
.sort span{font-size:.8rem;color:#64748b;font-weight:700}
.sort select{flex:1;padding:7px 10px;border:2px solid #ccfbf1;border-radius:8px;font-size:.8rem;background:#fff}
.chart{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);border:1px solid #e2e8f0}
.ctit{font-size:.9rem;font-weight:800;color:#0f766e;text-align:center;margin-bottom:10px}
.cbar{display:flex;align-items:flex-end;justify-content:center;gap:8px;height:110px;padding:8px 0}
.cit{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;max-width:55px}
.cfill{width:100%;border-radius:6px 6px 0 0;min-height:4px;position:relative}
.cfill::after{content:attr(data-v);position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:.65rem;font-weight:800;color:#1e293b;white-space:nowrap}
.clbl{font-size:.65rem;color:#64748b;font-weight:700;text-align:center}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 24px;border-radius:40px;font-weight:800;font-size:.9rem;opacity:0;transition:.3s;z-index:99999}
#toast.on{opacity:1}
#md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:99998;padding:16px}
#md.on{display:flex}
.mbox{background:#fff;border-radius:14px;padding:22px;max-width:360px;width:100%;text-align:center;border:1px solid #e2e8f0}
.mbox h3{margin-bottom:10px;font-size:1.05rem}
.mbox p{color:#64748b;margin-bottom:18px;font-size:.9rem}
.mact{display:flex;gap:8px}
.mact button{flex:1;padding:10px;border:none;border-radius:8px;font-weight:800;cursor:pointer;font-size:.85rem}
.mcanc{background:#f1f5f9;color:#1e293b;border:1px solid #e2e8f0}
.mconf{background:#ef4444;color:#fff}
@media(max-width:360px){.row{grid-template-columns:1fr}.tab{font-size:.7rem;padding:9px 1px}}
</style>
</head>
<body>
<div class="c">
<header><h1>صحتي <span style="font-size:.65rem;background:#0d9488;color:#fff;padding:3px 10px;border-radius:20px;vertical-align:middle">PRO</span></h1><p class="sub">متابعة الفحوصات والأدوية بذكاء</p></header>

<div class="stats"><div><b id="ne">0</b><span>الفحوصات</span></div><div><b id="nm">0</b><span>الأدوية</span></div><div><b id="na">0</b><span>التنبيهات</span></div></div>

<div class="bar"><button onclick="ex()">تصدير</button><button onclick="im()">استيراد</button><button onclick="pdf()">PDF</button><input type="file" id="ifile" style="display:none" onchange="ifr(this)"></div>

<div class="tabs">
<button id="t1" onclick="sw(1)" style="background:#0d9488;color:#fff;box-shadow:0 2px 8px rgba(13,148,136,.3)">التنبيهات</button>
<button id="t2" onclick="sw(2)">الفحوصات</button>
<button id="t3" onclick="sw(3)">الأدوية</button>
<button id="t4" onclick="sw(4)">إحصائيات</button>
</div>

<div id="s1" style="display:block">
  <div class="card"><div class="tit">لوحة التنبيهات</div><div class="info">الفحص: قبل <b>أسبوع</b> من موعده | الدواء: قبل <b>يومين</b> من الانتهاء</div><div id="al"></div></div>
</div>

<div id="s2" style="display:none">
  <div class="card"><div class="tit">إضافة فحص جديد</div>
    <div class="fg"><label>نوع الفحص *</label><input id="xn" placeholder="مثال: تحليل سكر صائم..."></div>
    <div class="fg"><label>تاريخ آخر فحص *</label><input type="date" id="xd"></div>
    <div class="fg"><label>التكرار *</label><select id="xf"><option value="1">كل شهر</option><option value="2">كل شهرين</option><option value="3" selected>كل 3 أشهر</option><option value="6">كل 6 أشهر</option><option value="12">كل سنة</option></select></div>
    <div class="fg"><label>موعد القادم (اختياري)</label><input type="date" id="xt"></div>
    <div class="fg"><label>توصية الطبيب (اختياري)</label><textarea id="xr" placeholder="مثال: صيام 12 ساعة..."></textarea></div>
    <button class="btn" onclick="sx()">حفظ الفحص</button>
  </div>
  <div class="src"><input id="se" placeholder="البحث في الفحوصات..." oninput="re()"></div>
  <div class="sort"><span>الترتيب:</span><select id="soe" onchange="re()"><option value="date">التاريخ</option><option value="name">الاسم</option><option value="urg">الأولوية</option></select></div>
  <div id="xl"></div>
</div>

<div id="s3" style="display:none">
  <div class="card"><div class="tit">إضافة دواء جديد</div>
    <div class="fg"><label>اسم الدواء *</label><input id="mn" placeholder="اكتب اسم الدواء..."></div>
    <div class="row"><div class="fg"><label>تاريخ البدء *</label><input type="date" id="ms"></div><div class="fg"><label>عدد العلب *</label><input type="number" id="mb" value="1" min="1"></div></div>
    <div class="row"><div class="fg"><label>حبات كل علبة *</label><input type="number" id="mp" placeholder="30" min="1"></div><div class="fg"><label>الجرعة اليومية *</label><input type="number" id="mo" placeholder="2" min="1"></div></div>
    <button class="btn" onclick="sm()">حفظ الدواء</button>
  </div>
  <div class="src"><input id="sme" placeholder="البحث في الأدوية..." oninput="rm()"></div>
  <div class="sort"><span>الترتيب:</span><select id="som" onchange="rm()"><option value="date">التاريخ</option><option value="name">الاسم</option><option value="urg">الأولوية</option></select></div>
  <div id="ml"></div>
</div>

<div id="s4" style="display:none">
  <div class="chart"><div class="ctit">توزيع الفحوصات حسب التكرار</div><div class="cbar" id="che"></div></div>
  <div class="chart"><div class="ctit">الأدوية الأقرب للانتهاء</div><div class="cbar" id="chm"></div></div>
  <div class="card"><div class="tit">ملخص</div><div id="sum"></div></div>
</div>
</div>

<div id="toast"></div>
<div id="md"><div class="mbox"><h3 id="mh">تأكيد</h3><p id="mt">هل تريد حذف هذا العنصر؟</p><div class="mact"><button class="mcanc" onclick="cm()">إلغاء</button><button class="mconf" id="mok">حذف</button></div></div></div>

<script>
(function(){
var K='se7ti_final_v2',D={exams:[],meds:[]};
function ld(){try{var r=localStorage.getItem(K);if(r)D=JSON.parse(r);}catch(e){}st();ra();}
function sv(){try{localStorage.setItem(K,JSON.stringify(D));}catch(e){tm('تعذر الحفظ')}ra();}
function tm(m){var t=document.getElementById('toast');t.textContent=m;t.className='on';setTimeout(function(){t.className='';},2800);}
function td(){return new Date().toISOString().split('T')[0];}
function ad(ds,d){var x=new Date(ds);x.setDate(x.getDate()+d);return x.toISOString().split('T')[0];}
function am(ds,m){var x=new Date(ds);x.setMonth(x.getMonth()+parseInt(m));return x.toISOString().split('T')[0];}
function df(f,t){return Math.ceil((new Date(t)-new Date(f))/864e5);}
function fd(d){return d?new Date(d).toLocaleDateString('ar-SA',{year:'numeric',month:'long',day:'numeric'}):'—';}
function gn(e){return e.next||am(e.date,e.freq);}

window.sw=function(n){
  for(var i=1;i<=4;i++){
    document.getElementById('s'+i).style.display='none';
    document.getElementById('t'+i).style.background='transparent';
    document.getElementById('t'+i).style.color='#64748b';
    document.getElementById('t'+i).style.boxShadow='none';
  }
  document.getElementById('s'+n).style.display='block';
  document.getElementById('t'+n).style.background='#0d9488';
  document.getElementById('t'+n).style.color='#fff';
  document.getElementById('t'+n).style.boxShadow='0 2px 8px rgba(13,148,136,.3)';
};

function va(ids){for(var i=0;i<ids.length;i++){var el=document.getElementById(ids[i][0]);if(!el||!el.value.trim()){tm('مطلوب: '+ids[i][1]);if(el)el.focus();return false;}}return true;}

window.sx=function(){if(!va([['xn','نوع الفحص'],['xd','تاريخ آخر فحص']]))return;var n=document.getElementById('xn').value.trim(),d=document.getElementById('xd').value,f=document.getElementById('xf').value,nt=document.getElementById('xt').value,r=document.getElementById('xr').value.trim();if(nt&&nt<d){tm('موعد القادم يجب أن يكون بعد تاريخ الفحص');return;}D.exams.push({id:Date.now(),name:n,date:d,freq:f,next:nt,rec:r});sv();document.getElementById('xn').value='';document.getElementById('xt').value='';document.getElementById('xr').value='';st();tm('تم حفظ الفحص');};
window.dx=function(id){om('حذف فحص','هل تريد حذف هذا الفحص نهائياً؟',function(){D.exams=D.exams.filter(function(e){return e.id!==id;});sv();tm('تم حذف الفحص');});};
window.sm=function(){if(!va([['mn','اسم الدواء'],['mp','حبات كل علبة'],['mo','الجرعة اليومية']]))return;var n=document.getElementById('mn').value.trim(),b=parseInt(document.getElementById('mb').value)||1,pp=parseInt(document.getElementById('mp').value),d=parseInt(document.getElementById('mo').value),s=document.getElementById('ms').value||td();if(pp<1||d<1){tm('الحقول يجب أن تكون أكبر من صفر');return;}var tq=b*pp,dy=Math.floor(tq/d);D.meds.push({id:Date.now(),name:n,boxes:b,perBox:pp,total:tq,dose:d,start:s,days:dy});sv();document.getElementById('mn').value='';document.getElementById('mb').value='1';document.getElementById('mp').value='';document.getElementById('mo').value='';st();tm('تم حفظ الدواء');};
window.dm=function(id){om('حذف دواء','هل تريد حذف هذا الدواء نهائياً؟',function(){D.meds=D.meds.filter(function(m){return m.id!==id;});sv();tm('تم حذف الدواء');});};
window.rn=function(id){var m=D.meds.find(function(x){return x.id===id;});if(!m)return;var a=prompt('عدد العلب الإضافية لـ "'+m.name+'"','1');var ab=parseInt(a);if(!ab||ab<1)return;m.boxes+=ab;m.total=m.boxes*m.perBox;m.days=Math.floor(m.total/m.dose);sv();tm('تم التجديد (+'+ab+' علبة)');};

var cb=null;
function om(t,tx,callback){document.getElementById('mh').textContent=t;document.getElementById('mt').textContent=tx;cb=callback;document.getElementById('md').style.display='flex';}
window.cm=function(){document.getElementById('md').style.display='none';cb=null;};
document.getElementById('mok').onclick=function(){cm();if(cb)cb();};

function ra(){document.getElementById('ne').textContent=D.exams.length;document.getElementById('nm').textContent=D.meds.length;re();rm();ral();rs();}
function re(){
  var c=document.getElementById('xl'),q=document.getElementById('se').value.trim().toLowerCase(),so=document.getElementById('soe').value;
  var list=D.exams.slice();if(q)list=list.filter(function(e){return e.name.toLowerCase().includes(q);});
  if(so==='name')list.sort(function(a,b){return a.name.localeCompare(b.name);});
  else if(so==='urg')list.sort(function(a,b){return df(td(),gn(a))-df(td(),gn(b));});
  else list.sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  if(!list.length){c.innerHTML='<div class="emp"><em></em>لا توجد فحوصات مسجلة<br><small>اضغط على تبويب الفحوصات لإضافة جديد</small></div>';return;}
  c.innerHTML=list.map(function(e){
    var nx=gn(e),rm=df(td(),nx);
    var bg=rm<=0?'<span class="bdg bd">متأخر!</span>':rm<=7?'<span class="bdg bw">قريب</span>':'<span class="bdg bs">بعيد</span>';
    var nl=e.next?'القادم: ':'القادم (محسوب): ';
    var rc=e.rec?'<div class="rec">'+e.rec+'</div>':'';
    return '<div class="it"><button class="del" onclick="dx('+e.id+')">×</button><div class="n">'+e.name+' '+bg+'</div><div class="m">آخر فحص: <strong>'+fd(e.date)+'</strong><br>التكرار: كل <strong>'+e.freq+'</strong> أشهر<br>'+nl+'<strong>'+fd(nx)+'</strong> ('+(rm<=0?'متأخر!':rm+' يوم متبقي')+')</div>'+rc+'</div>';
  }).join('');
}
function rm(){
  var c=document.getElementById('ml'),q=document.getElementById('sme').value.trim().toLowerCase(),so=document.getElementById('som').value;
  var list=D.meds.slice();if(q)list=list.filter(function(m){return m.name.toLowerCase().includes(q);});
  if(so==='name')list.sort(function(a,b){return a.name.localeCompare(b.name);});
  else if(so==='urg')list.sort(function(a,b){return df(td(),ad(a.start,a.days))-df(td(),ad(b.start,b.days));});
  else list.sort(function(a,b){return new Date(b.start)-new Date(a.start);});
  if(!list.length){c.innerHTML='<div class="emp"><em></em>لا توجد أدوية مسجلة<br><small>اضغط على تبويب الأدوية لإضافة جديد</small></div>';return;}
  c.innerHTML=list.map(function(m){
    var en=ad(m.start,m.days),rm=df(td(),en);
    var bg=rm<=0?'<span class="bdg bd">انتهى!</span>':rm<=2?'<span class="bdg bd">ينتهي قريب!</span>':rm<=7?'<span class="bdg bw">ينتهي قريباً</span>':'<span class="bdg bs">متوفر</span>';
    return '<div class="it"><button class="del" onclick="dm('+m.id+')">×</button><div class="n">'+m.name+' '+bg+'</div><div class="m">'+m.boxes+' علبة × '+m.perBox+' حبة/علبة = '+m.total+' حبة إجمالي<br>الجرعة اليومية: '+m.dose+' حبة/يوم | تكفي '+m.days+' يوم<br>من '+fd(m.start)+' إلى '+fd(en)+'<br>'+(rm<=0?'انتهى!':rm+' يوم متبقي')+'</div><div class="act"><button class="rn" onclick="rn('+m.id+')">تجديد الدواء</button><button class="dl" onclick="dm('+m.id+')">حذف</button></div></div>';
  }).join('');
}
function ral(){
  var c=document.getElementById('al');var al=[];
  D.exams.forEach(function(e){
    var nx=gn(e),d=df(td(),nx);
    if(d<=7&&d>0)al.push({t:'w',ti:'فحص '+e.name,tx:'القادم '+fd(nx)+' — بعد '+d+' يوم'+(e.rec?'<br>'+e.rec:'')});
    else if(d<=0)al.push({t:'d',ti:'فحص '+e.name+' متأخر!',tx:'موعد الفحص كان '+fd(nx)+(e.rec?'<br>'+e.rec:'')});
  });
  D.meds.forEach(function(m){
    var en=ad(m.start,m.days),d=df(td(),en);
    if(d<=2&&d>0)al.push({t:'w',ti:'دواء '+m.name+' ينتهي قريباً!',tx:'يتبقى '+d+(d===1?' يوم':' أيام')+' — اشتري المخزون'});
    else if(d<=0)al.push({t:'d',ti:'دواء '+m.name+' انتهى!',tx:'انتهى المخزون بتاريخ '+fd(en)});
  });
  if(D.meds.length>1){
    var am=D.meds.filter(function(m){return df(td(),ad(m.start,m.days))>0;});
    if(am.length>1){
      var md=am.map(function(m){return{n:m.name,d:df(td(),ad(m.start,m.days))};});
      var sh=md.reduce(function(a,b){return a.d<b.d?a:b;});
      if(sh.d<7&&sh.d>2){
        var om=md.filter(function(x){return x.n!==sh.n&&x.d>sh.d;});
        al.push({t:'i',ti:'تنبيه ذكي',tx:'دواء "'+sh.n+'" الأقرب للنفاض ('+sh.d+' يوم). تأكد من توفر المخزون.'+(om.length?' — بعده: '+om.slice(0,2).map(function(x){return x.n+' ('+x.d+'ي)';}).join('، ')+'':''')});
      }
    }
  }
  document.getElementById('na').textContent=al.length;
  if(!al.length){c.innerHTML='<div class="emp"><em></em>لا توجد تنبيهات حالية!<br><small>كل شيء تحت السيطرة</small></div>';return;}
  al.sort(function(a,b){return(a.t==='d'?0:a.t==='w'?1:2)-(b.t==='d'?0:b.t==='w'?1:2);});
  c.innerHTML=al.map(function(a){return '<div class="alert '+(a.t==='d'?'d':a.t==='i'?'i':'')+'"><b>'+a.ti+'</b><span>'+a.tx+'</span></div>';}).join('');
}
function rs(){
  var fc={1:0,2:0,3:0,6:0,12:0};D.exams.forEach(function(e){fc[e.freq]=(fc[e.freq]||0)+1;});
  var cols=['#0d9488','#3b82f6','#f59e0b','#ef4444','#8b5cf6'];
  var lbs={'1':'شهر','2':'شهرين','3':'3 أشهر','6':'6 أشهر','12':'سنة'};
  var me=Math.max.apply(null,Object.values(fc).concat([1]));
